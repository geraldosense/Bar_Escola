<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balcão | BarEscola</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="icon" type="image/svg+xml" href="/barescola/favicon.svg">
  <script type="module" src="../js/balcao.js"></script>
</head>
<body>
  <header class="topo">
    <div class="topo-interior">
    <a class="marca" href="fila.html"><img src="../img/logo/logo-branco.svg" alt="BarEscola" width="148" height="30"><span class="marca-area">Balcão</span></a>
    <div class="utilizador">
      <span class="avatar" data-avatar aria-hidden="true"></span>
      <span class="nome" data-utilizador-nome></span>
      <form method="post" action="../logout"><button class="btn-sair" type="submit"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Sair</span></button></form>
    </div>
    </div>
  </header>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <div>
        <h1>Fila de encomendas</h1>
        <p>Por intervalo e por ordem de chegada. A lista atualiza-se sozinha.</p>
      </div>
      <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
        <label for="filtro-intervalo" class="sr-only">Intervalo</label>
        <select id="filtro-intervalo" style="width:auto"><option value="">Todos os intervalos</option></select>
        <span class="ligacao" id="ligacao">A ligar…</span>
      </div>
    </div>

    <div class="colunas-balcao">
      <section class="coluna" aria-labelledby="t-novas">
        <h2 id="t-novas">Por preparar <span class="contador" id="c-preparar">0</span></h2>
        <div class="lista-encomendas" id="col-preparar"></div>
      </section>
      <section class="coluna coluna-prontas" aria-labelledby="t-prontas">
        <h2 id="t-prontas">Prontas a levantar <span class="contador" id="c-prontas">0</span></h2>
        <div class="lista-encomendas" id="col-prontas"></div>
      </section>
      <section class="coluna" aria-labelledby="t-resumo">
        <h2 id="t-resumo">Resumo por intervalo</h2>
        <div class="cartao" id="resumo"></div>
      </section>
    </div>
  </main>
</body>
</html>
