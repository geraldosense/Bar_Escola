<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Os meus pedidos | BarEscola</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="icon" type="image/svg+xml" href="/barescola/favicon.svg">
  <script type="module" src="../js/pedidos.js"></script>
</head>
<body>
  <header class="topo">
    <div class="topo-interior">
    <a class="marca" href="menu.html"><img src="../img/logo/logo-branco.svg" alt="BarEscola" width="148" height="30"></a>
    <nav aria-label="Principal">
      <a href="menu.html">Menu</a>
      <a href="pedidos.html" aria-current="page">Os meus pedidos</a>
    </nav>
    <div class="utilizador">
      <span class="avatar" data-avatar aria-hidden="true"></span>
      <span class="nome" data-utilizador-nome></span>
      <span class="saldo" data-saldo title="Saldo do cartão" hidden></span>
      <form method="post" action="../logout"><button class="btn-sair" type="submit"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Sair</span></button></form>
    </div>
    </div>
  </header>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <div>
        <h1>Os meus pedidos</h1>
        <p>Quando o bar marcar o pedido como pronto, a senha fica amarela e recebes um aviso.</p>
      </div>
      <span class="ligacao" id="ligacao">A ligar…</span>
    </div>
    <div class="lista-encomendas" id="encomendas" aria-live="polite">
      <p class="vazio-grande">A carregar…</p>
    </div>
  </main>
</body>
</html>
