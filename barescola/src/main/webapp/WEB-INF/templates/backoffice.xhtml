<!DOCTYPE html>
<html lang="pt"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title><ui:insert name="titulo">Backoffice</ui:insert> | BarEscola</title>
  <link rel="stylesheet" href="#{request.contextPath}/css/app.css"/>
  <link rel="icon" type="image/svg+xml" href="/barescola/favicon.svg"/>
</h:head>
<h:body>
  <header class="topo">
    <div class="topo-interior">
    <a class="marca" href="#{request.contextPath}/backoffice/produtos.xhtml"><img src="#{request.contextPath}/img/logo/logo-branco.svg" alt="BarEscola" width="148" height="30"/><span class="marca-area">Gestão</span></a>
    <nav aria-label="Backoffice">
      <a href="#{request.contextPath}/backoffice/produtos.xhtml"
         aria-current="#{view.viewId eq '/backoffice/produtos.xhtml' ? 'page' : 'false'}">Produtos e stock</a>
      <a href="#{request.contextPath}/backoffice/vendas.xhtml"
         aria-current="#{view.viewId eq '/backoffice/vendas.xhtml' ? 'page' : 'false'}">Vendas</a>
      <a href="#{request.contextPath}/backoffice/saldos.xhtml"
         aria-current="#{view.viewId eq '/backoffice/saldos.xhtml' ? 'page' : 'false'}">Saldos</a>
      <a href="#{request.contextPath}/balcao/fila.html">Balcão</a>
    </nav>
    <div class="utilizador">
      <span class="nome">#{request.userPrincipal.name}</span>
      <form method="post" action="#{request.contextPath}/logout"><button class="btn-sair" type="submit"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Sair</span></button></form>
    </div>
    </div>
  </header>

  <main class="conteudo">
    <h:messages styleClass="mensagens" infoClass="info" errorClass="erro" warnClass="erro" globalOnly="false"/>
    <ui:insert name="conteudo"/>
  </main>
</h:body>
</html>
