<ui:composition template="/WEB-INF/templates/backoffice.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:pt="jakarta.faces.passthrough">

  <ui:define name="titulo">Saldos</ui:define>

  <ui:define name="conteudo">
    <div class="cabecalho-pagina">
      <div>
        <h1>Carregamentos de saldo</h1>
        <p>Carregar o cartão de estudante de um aluno.</p>
      </div>
    </div>

    <div class="grelha-menu">
      <section class="cartao">
        <h2>Alunos</h2>
        <div class="tabela-wrapper">
          <h:dataTable value="#{saldosBean.alunos}" var="a">
            <h:column>
              <f:facet name="header">Nº cartão</f:facet>
              #{a.numero()}
            </h:column>
            <h:column>
              <f:facet name="header">Nome</f:facet>
              #{a.nome()}
            </h:column>
            <h:column>
              <f:facet name="header">Turma</f:facet>
              #{a.turma()}
            </h:column>
            <h:column headerClass="num">
              <f:facet name="header">Saldo</f:facet>
              <div class="num">
                <h:outputText value="#{a.saldo()}">
                  <f:convertNumber type="currency" currencyCode="EUR" locale="pt_PT"/>
                </h:outputText>
              </div>
            </h:column>
          </h:dataTable>
        </div>
      </section>

      <aside class="cartao">
        <h:form id="carregamento">
          <h2>Novo carregamento</h2>
          <div class="campo">
            <h:outputLabel for="numero" value="Nº do cartão"/>
            <h:inputText id="numero" value="#{saldosBean.numero}" required="true"
                         requiredMessage="Indique o número do cartão." pt:type="number"/>
          </div>
          <div class="campo">
            <h:outputLabel for="valor" value="Valor (€)"/>
            <h:inputText id="valor" value="#{saldosBean.valor}" required="true"
                         requiredMessage="Indique o valor."
                         pt:type="number" pt:step="0.50" pt:min="0.50" pt:max="100">
              <f:validateDoubleRange minimum="0.5" maximum="100"/>
            </h:inputText>
            <p class="ajuda">Entre 0,50 € e 100,00 €.</p>
          </div>
          <h:commandButton value="Carregar" action="#{saldosBean.carregar}" styleClass="btn btn-bloco"/>
        </h:form>
      </aside>
    </div>
  </ui:define>
</ui:composition>
